syntax = "proto3";
package imauth.v1;

import "imauth/v1/common.proto";

service AuthService {
  // Open a browser for the given platform and wait for the user to log in.
  // Streams AuthEvents: Loading → WaitingForUser (with viewer_url) → Connected.
  rpc Login(LoginRequest) returns (stream AuthEvent);

  // 현재 세션 상태 조회
  rpc GetStatus(StatusRequest) returns (AuthStatusResponse);

  // 세션 취소
  rpc Cancel(CancelRequest) returns (AuthResponse);
}

message LoginRequest {
  Platform platform = 1;
  // username (tag 2) and password (tag 3) removed — login is now user-driven.
  reserved 2, 3;
}

message AuthEvent {
  string session_id = 1;
  AuthStatus status = 2;
  string message = 3;
  bool requires_input = 4;
  string input_type = 5;   // "viewer_url"
  repeated Cookie cookies = 6;
  reserved 7;
  string viewer_url = 8;   // Browser viewer URL for user to interact with the browser
}

message AuthResponse {
  bool success = 1;
  string session_id = 2;
  string message = 3;
  repeated Cookie cookies = 4;
}

message StatusRequest {
  string session_id = 1;
}

message AuthStatusResponse {
  string session_id = 1;
  AuthStatus status = 2;
  string message = 3;
  bool requires_input = 4;
  string input_type = 5;
}

message CancelRequest {
  string session_id = 1;
}
