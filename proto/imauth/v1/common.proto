syntax = "proto3";
package imauth.v1;

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_INSTAGRAM = 1;
  PLATFORM_THREADS = 2;
  PLATFORM_NAVER = 3;
  PLATFORM_MUNPIA = 5;
}

enum AuthStatus {
  AUTH_STATUS_UNSPECIFIED = 0;
  AUTH_STATUS_IDLE = 1;
  AUTH_STATUS_LOADING = 2;
  AUTH_STATUS_AUTHENTICATING = 3;
  AUTH_STATUS_WAITING_FOR_USER = 4;
  // Tags 5 (NEEDS_2FA) and 6 (NEEDS_CAPTCHA) removed — login is now user-driven.
  reserved 5, 6;
  AUTH_STATUS_CONNECTED = 7;
  AUTH_STATUS_FAILED = 8;
}

message Cookie {
  string name = 1;
  string value = 2;
  string domain = 3;
  string path = 4;
  int64 expires = 5;
  bool http_only = 6;
  bool secure = 7;
}

message Empty {}
