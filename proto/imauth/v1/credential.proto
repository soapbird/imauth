syntax = "proto3";
package imauth.v1;

import "imauth/v1/common.proto";

service CredentialService {
  rpc Save(SaveCredentialRequest) returns (CredentialResponse);
  rpc Get(GetCredentialRequest) returns (CredentialInfo);
  rpc Delete(DeleteCredentialRequest) returns (CredentialResponse);
}

message SaveCredentialRequest {
  Platform platform = 1;
  string username = 2;
  string password = 3;
  string twofa_method = 4;  // "totp", "sms", "email", "app"
}

message GetCredentialRequest {
  Platform platform = 1;
}

message CredentialInfo {
  Platform platform = 1;
  string username = 2;
  bool has_password = 3;
  string twofa_method = 4;
}

message DeleteCredentialRequest {
  Platform platform = 1;
}

message CredentialResponse {
  bool success = 1;
  Platform platform = 2;
  string username = 3;
}
