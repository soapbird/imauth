services:
  chrome-0:
    container_name: services-imauth-chrome-0
    image: ${BROWSER_KASM_IMAGE:-kasmweb/chromium:1.18.0}
    shm_size: "2gb"
    restart: unless-stopped
    user: "0:0"
    entrypoint:
      - /bin/bash
      - -lc
      - |
        mkdir -p /home/kasm-user/.config/chromium
        rm -f /home/kasm-user/.config/chromium/SingletonLock /home/kasm-user/.config/chromium/SingletonSocket /home/kasm-user/.config/chromium/SingletonCookie
        chown -R kasm-user:kasm-user /home/kasm-user/.config /home/kasm-user/.cache /home/kasm-user/.local /home/kasm-user/Desktop /home/kasm-user/Downloads /home/kasm-user/Uploads 2>/dev/null || true
        mkdir -p /home/kasm-user/.vnc
        cat > /home/kasm-user/.vnc/kasmvnc.yaml <<'YAML'
        encoding:
          max_frame_rate: 24
          full_frame_updates: none
          rect_encoding_mode:
            min_quality: 4
            max_quality: 6
            consider_lossless_quality: 10
            rectangle_compress_threads: auto
          compare_framebuffer: auto
        YAML
        chown -R kasm-user:kasm-user /home/kasm-user/.config /home/kasm-user/.cache /home/kasm-user/.local /home/kasm-user/Desktop /home/kasm-user/Downloads /home/kasm-user/Uploads /home/kasm-user/.vnc 2>/dev/null || true
        printf '#!/usr/bin/env bash\nexit 0\n' >/usr/bin/desktop_ready
        chmod +x /usr/bin/desktop_ready
        cat > /tmp/browser-cdp-relay.py <<'PY'
        import shutil
        import socket
        import socketserver
        import threading

        class Relay(socketserver.BaseRequestHandler):
            def handle(self):
                try:
                    upstream = socket.create_connection(("127.0.0.1", 9222), timeout=10)
                except OSError:
                    return

                def pump(src, dst):
                    try:
                        shutil.copyfileobj(src.makefile("rb", buffering=0), dst.makefile("wb", buffering=0))
                    except OSError:
                        pass
                    finally:
                        for item in (src, dst):
                            try:
                                item.shutdown(socket.SHUT_RDWR)
                            except OSError:
                                pass

                threads = [
                    threading.Thread(target=pump, args=(self.request, upstream), daemon=True),
                    threading.Thread(target=pump, args=(upstream, self.request), daemon=True),
                ]
                for thread in threads:
                    thread.start()
                try:
                    for thread in threads:
                        thread.join()
                finally:
                    for item in (self.request, upstream):
                        try:
                            item.close()
                        except OSError:
                            pass

        class Server(socketserver.ThreadingTCPServer):
            allow_reuse_address = True
            daemon_threads = True

        Server(("0.0.0.0", 9223), Relay).serve_forever()
        PY
        runuser -u kasm-user -- python3 /tmp/browser-cdp-relay.py &
        exec runuser -u kasm-user -- /dockerstartup/kasm_default_profile.sh /dockerstartup/vnc_startup.sh /dockerstartup/kasm_startup.sh --wait
    environment:
      VNC_RESOLUTION: ${BROWSER_KASM_RESOLUTION:-1366x768}
      MAX_FRAME_RATE: "24"
      VNC_PW: imauth-local-only
      VNCOPTIONS: >-
        -PreferBandwidth
        -DynamicQualityMin=4
        -DynamicQualityMax=6
        -SecurityTypes None
        -DisableBasicAuth 1
        -sslOnly 0
        -AcceptSetDesktopSize 1
        -MaxVideoResolution 1280x720
      KASM_SVC_AUDIO: "0"
      KASM_SVC_AUDIO_INPUT: "0"
      KASM_SVC_UPLOADS: "0"
      KASM_SVC_GAMEPAD: "0"
      KASM_SVC_WEBCAM: "0"
      KASM_SVC_PRINTER: "0"
      KASM_SVC_SMARTCARD: "0"
      LAUNCH_URL: about:blank
      APP_ARGS: >-
        --start-maximized
        --remote-debugging-address=0.0.0.0
        --remote-debugging-port=9222
        --user-data-dir=/home/kasm-user/.config/chromium
        --lang=ko-KR
    volumes:
      - ../imauth-data/chrome-0:/home/kasm-user/.config/chromium:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9223/json/version"]
      interval: 3s
      timeout: 5s
      retries: 10

  chrome-0-proxy:
    container_name: services-imauth-chrome-0-proxy
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      chrome-0:
        condition: service_healthy
    command:
      - sh
      - -lc
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 8080;
          server_name _;

          proxy_http_version 1.1;
          tcp_nodelay on;
          proxy_buffering off;
          proxy_request_buffering off;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto http;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_read_timeout 86400;
          proxy_send_timeout 86400;


          location / {
            proxy_pass http://chrome-0:6901;
          }
        }
        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          '' close;
        }
        EOF
        exec nginx -g 'daemon off;'
    ports:
      - "${IMAUTH_BROWSER_VIEWER_PORT_0:-6101}:8080"

