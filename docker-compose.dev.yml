  server:
    container_name: services-imauth-server
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - IMAUTH_CDP_URLS=http://chrome-0:9223,http://chrome-1:9223,http://chrome-2:9223
      - IMAUTH_GRPC_ADDR=0.0.0.0:50051
      - IMAUTH_DATA_DIR=/data/.imauth/data
      - IMAUTH_ENCRYPTION_KEY=${IMAUTH_ENCRYPTION_KEY}
      - IMAUTH_API_KEY=${IMAUTH_API_KEY}
      - IMAUTH_BROWSER_VIEWER_URLS=http://${IMAUTH_SERVER_HOSTNAME:-localhost}:${IMAUTH_BROWSER_VIEWER_PORT_0:-6101}/index.html,http://${IMAUTH_SERVER_HOSTNAME:-localhost}:${IMAUTH_BROWSER_VIEWER_PORT_1:-6102}/index.html,http://${IMAUTH_SERVER_HOSTNAME:-localhost}:${IMAUTH_BROWSER_VIEWER_PORT_2:-6103}/index.html
    volumes:
      - ../imauth-data/imauth:/data/.imauth
    depends_on:
      chrome-0:
        condition: service_healthy
      chrome-1:
        condition: service_healthy
      chrome-2:
        condition: service_healthy
    ports:
      - "${IMAUTH_GRPC_HOST_PORT:-6100}:50051"
    command: ["serve"]
