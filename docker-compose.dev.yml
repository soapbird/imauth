name: service-imauth

services:
  chrome-0:
    container_name: imauth-chrome-0
    image: ${BROWSER_KASM_IMAGE:-kasmweb/chromium:1.18.0}
    shm_size: "2gb"
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -lc
      - |
        mkdir -p /home/kasm-user/.config/chromium
        rm -f /home/kasm-user/.config/chromium/SingletonLock /home/kasm-user/.config/chromium/SingletonSocket /home/kasm-user/.config/chromium/SingletonCookie
        chown -R kasm-user:kasm-user /home/kasm-user/.config /home/kasm-user/.cache /home/kasm-user/.local /home/kasm-user/Desktop /home/kasm-user/Downloads /home/kasm-user/Uploads 2>/dev/null || true
        mkdir -p /home/kasm-user/.vnc
        cat > /home/kasm-user/.vnc/kasmvnc.yaml <<'YAML'
        encoding:
          max_frame_rate: 24
          full_frame_updates: none
          rect_encoding_mode:
            min_quality: 4
            max_quality: 6
            consider_lossless_quality: 10
            rectangle_compress_threads: auto
          compare_framebuffer: auto
        YAML
        chown -R kasm-user:kasm-user /home/kasm-user/.config /home/kasm-user/.cache /home/kasm-user/.local /home/kasm-user/Desktop /home/kasm-user/Downloads /home/kasm-user/Uploads /home/kasm-user/.vnc 2>/dev/null || true
        printf '#!/usr/bin/env bash\nexit 0\n' >/usr/bin/desktop_ready
        chmod +x /usr/bin/desktop_ready
        cat > /tmp/browser-cdp-relay.py <<'PY'
        import os
        import shutil
        import socket
        import socketserver
        import threading

        class Relay(socketserver.BaseRequestHandler):
            def handle(self):
                try:
                    upstream = socket.create_connection(("127.0.0.1", 9222), timeout=10)
                except OSError:
                    return

                def pump(src, dst):
                    try:
                        shutil.copyfileobj(src.makefile("rb", buffering=0), dst.makefile("wb", buffering=0))
                    except OSError:
                        pass
                    finally:
                        for item in (src, dst):
                            try:
                                item.shutdown(socket.SHUT_RDWR)
                            except OSError:
                                pass

                threads = [
                    threading.Thread(target=pump, args=(self.request, upstream), daemon=True),
                    threading.Thread(target=pump, args=(upstream, self.request), daemon=True),
                ]
                for thread in threads:
                    thread.start()
                try:
                    for thread in threads:
                        thread.join()
                finally:
                    for item in (self.request, upstream):
                        try:
                            item.close()
                        except OSError:
                            pass

        class Server(socketserver.ThreadingTCPServer):
            allow_reuse_address = True
            daemon_threads = True

        bind_address = os.environ.get("CDP_RELAY_BIND_ADDR") or socket.gethostbyname(socket.gethostname())
        Server((bind_address, 9223), Relay).serve_forever()
        PY
        runuser -u kasm-user -- python3 /tmp/browser-cdp-relay.py &
        exec runuser -u kasm-user -- /dockerstartup/kasm_default_profile.sh /dockerstartup/vnc_startup.sh /dockerstartup/kasm_startup.sh --wait
    environment:
      VNC_RESOLUTION: ${BROWSER_KASM_RESOLUTION:-1366x768}
      MAX_FRAME_RATE: "24"
      VNC_PW: imauth
      VNCOPTIONS: >-
        -PreferBandwidth
        -DynamicQualityMin=4
        -DynamicQualityMax=6
        -SecurityTypes None
        -DisableBasicAuth 1
        -sslOnly 0
        -AcceptSetDesktopSize 1
        -MaxVideoResolution 1280x720
      KASM_SVC_AUDIO: "0"
      KASM_SVC_AUDIO_INPUT: "0"
      KASM_SVC_UPLOADS: "0"
      KASM_SVC_GAMEPAD: "0"
      KASM_SVC_WEBCAM: "0"
      KASM_SVC_PRINTER: "0"
      KASM_SVC_SMARTCARD: "0"
      LAUNCH_URL: about:blank
      APP_ARGS: >-
        --start-maximized
        --remote-debugging-address=127.0.0.1
        --remote-debugging-port=9222
        --user-data-dir=/home/kasm-user/.config/chromium
        --lang=ko-KR
    volumes:
      - ${IMAUTH_DATA:-../imauth-data}/chrome-0:/home/kasm-user/.config/chromium:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://$$(hostname -i | awk '{print $$1}'):9223/json/version"]
      interval: 3s
      timeout: 5s
      retries: 10

  chrome-0-proxy:
    container_name: imauth-chrome-proxy-0
    image: imyounjs/chrome-proxy:latest
    build:
      context: .
      dockerfile: Dockerfile.chrome-proxy
    restart: unless-stopped
    depends_on:
      chrome-0:
        condition: service_healthy
    environment:
      UPSTREAM_HOST: chrome-0
      IMAUTH_VIEWER_TOKEN: ${IMAUTH_VIEWER_TOKEN}
    ports:
      - "${IMAUTH_NOVNC_BIND_ADDR:-127.0.0.1}:${IMAUTH_NOVNC_PORT_0:-6101}:8080"

  server:
    container_name: imauth-server
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - IMAUTH_CDP_URLS=http://chrome-0:9223
      - IMAUTH_GRPC_ADDR=0.0.0.0:50051
      - IMAUTH_DATA_DIR=/data/.imauth/data
      - IMAUTH_ENCRYPTION_KEY=${IMAUTH_ENCRYPTION_KEY}
      - IMAUTH_API_KEY=${IMAUTH_API_KEY}
      - IMAUTH_BROWSER_VIEWER_URLS=http://${IMAUTH_HOSTNAME:-localhost}:${IMAUTH_NOVNC_PORT_0:-6101}/index.html?token=${IMAUTH_VIEWER_TOKEN}
    volumes:
      - ${IMAUTH_DATA:-../imauth-data}/imauth:/data/.imauth
    depends_on:
      chrome-0:
        condition: service_healthy
    ports:
      - "${IMAUTH_HOSTPORT:-6100}:50051"
    command: ["serve"]

networks:
  default:
    name: net-imauth
    driver: bridge
