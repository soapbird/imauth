[server]
grpc_addr = "0.0.0.0:50051"

[nats]
url = "nats://localhost:4222"
stream_name = "imauth"

[browser]
cdp_url = "http://localhost:9222"
max_pool_size = 3
page_timeout_secs = 30

[storage]
data_dir = "~/.imauth/data"

[security]
encryption_key = ""  # 비어두면 자동 생성

[refresh]
interval_secs = 3600
retry_max = 3
