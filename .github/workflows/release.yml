name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
    steps:
      - uses: actions/checkout@v5
      - name: install protoc (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: install protoc (mac)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install cross-linker (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} -p imauth-server -p imauth-cli
      - name: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/imauth-server dist/
          cp target/${{ matrix.target }}/release/imauth dist/
          tar -czf imauth-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v6
        with:
          name: imauth-${{ matrix.target }}
          path: imauth-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  publish-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - suffix: ""
            dockerfile: Dockerfile
          - suffix: "-chrome"
            dockerfile: Dockerfile.chrome
          - suffix: "-chrome-proxy"
            dockerfile: Dockerfile.chrome-proxy
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: docker.lowapple.io
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          provenance: false
          tags: |
            docker.lowapple.io/imauth${{ matrix.image.suffix }}:${{ github.ref_name }}
            docker.lowapple.io/imauth${{ matrix.image.suffix }}:latest

  publish-sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine grpcio-tools ruff==0.16.4
      - name: generate and validate SDK
        working-directory: sdk/python
        run: make quality
      - name: build wheel
        working-directory: sdk/python
        run: python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: python-sdk
          path: sdk/python/dist/*

  publish-sdk-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - working-directory: sdk/typescript
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm test
          npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: ts-sdk
          path: sdk/typescript/dist/

  github-release:
    needs: [build, publish-docker, publish-sdk-python, publish-sdk-ts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: imauth-*
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          name: python-sdk
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          name: ts-sdk
      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*/*.tar.gz
            artifacts/*.whl
          generate_release_notes: true
