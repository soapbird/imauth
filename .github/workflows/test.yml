name: test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace
        env:
          PROTOC: /usr/bin/protoc
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3
        with:
          version: 1.72.0
          setup_only: true
      - run: buf lint
      - run: buf format --diff --exit-code
      - name: check breaking protobuf changes
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=${{ github.base_ref }},subdir=proto'

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: install + test
        working-directory: sdk/python
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e . anyio pytest grpcio-tools ruff==0.16.4
          make quality PYTHON=.venv/bin/python
          make test PYTHON=.venv/bin/python

  ts-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - working-directory: sdk/typescript
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm test
          npm run build
