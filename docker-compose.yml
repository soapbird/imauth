services:
  chrome:
    image: selenium/standalone-chromium:latest
    shm_size: '2gb'
    ports:
      - "${IMAUTH_GRPC_HOST_PORT:-50051}:50051"
    volumes:
      - ./scripts/chrome-entrypoint.sh:/chrome-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9222/json/version"]
      interval: 3s
      timeout: 5s
      retries: 10
    entrypoint: ["/bin/sh", "/chrome-entrypoint.sh"]

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - IMAUTH_CDP_URL=http://localhost:9222
      - IMAUTH_GRPC_ADDR=0.0.0.0:50051
      - IMAUTH_DATA_DIR=/data/.imauth/data
      # Required: 32-byte base64-encoded AES-256 key
      # Generate with: openssl rand -base64 32
      - IMAUTH_ENCRYPTION_KEY=${IMAUTH_ENCRYPTION_KEY}
      # Required: gRPC API key for client authentication.
      # Generate with: openssl rand -hex 32
      # Server refuses requests without a matching Authorization: Bearer <key> header.
      # If unset/empty, the server runs unauthenticated — DO NOT do this when 50051 is reachable from untrusted hosts.
      - IMAUTH_API_KEY=${IMAUTH_API_KEY}
    volumes:
      - imauth-data:/data/.imauth
    depends_on:
      chrome:
        condition: service_healthy
    command: ["serve"]
    network_mode: service:chrome

volumes:
  imauth-data:
