services:
  chrome-0:
    build:
      context: .
      dockerfile: Dockerfile.chrome
    shm_size: '2gb'
    restart: unless-stopped
    environment:
      - DISPLAY_NUM=99
      - VNC_PASSWORD=${VNC_PASSWORD:-imauth}
    ports:
      - "${IMAUTH_GRPC_HOST_PORT:-50051}:50051"
      - "${NOVNC_PORT_0:-6081}:6080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9222/json/version"]
      interval: 3s
      timeout: 5s
      retries: 10

  chrome-1:
    build:
      context: .
      dockerfile: Dockerfile.chrome
    shm_size: '2gb'
    restart: unless-stopped
    environment:
      - DISPLAY_NUM=100
      - VNC_PASSWORD=${VNC_PASSWORD:-imauth}
    ports:
      - "${NOVNC_PORT_1:-6082}:6080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9222/json/version"]
      interval: 3s
      timeout: 5s
      retries: 10

  chrome-2:
    build:
      context: .
      dockerfile: Dockerfile.chrome
    shm_size: '2gb'
    restart: unless-stopped
    environment:
      - DISPLAY_NUM=101
      - VNC_PASSWORD=${VNC_PASSWORD:-imauth}
    ports:
      - "${NOVNC_PORT_2:-6083}:6080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9222/json/version"]
      interval: 3s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - IMAUTH_CDP_URLS=http://localhost:9222
      - IMAUTH_GRPC_ADDR=0.0.0.0:50051
      - IMAUTH_DATA_DIR=/data/.imauth/data
      - IMAUTH_ENCRYPTION_KEY=${IMAUTH_ENCRYPTION_KEY}
      - IMAUTH_API_KEY=${IMAUTH_API_KEY}
      - IMAUTH_NOVNC_BASE_URL=http://${IMAUTH_SERVER_HOSTNAME:-localhost}
      - IMAUTH_NOVNC_PORTS=${NOVNC_PORT_0:-6081},${NOVNC_PORT_1:-6082},${NOVNC_PORT_2:-6083}
    volumes:
      - imauth-data:/data/.imauth
    depends_on:
      chrome-0:
        condition: service_healthy
      chrome-1:
        condition: service_healthy
      chrome-2:
        condition: service_healthy
    command: ["serve"]
    network_mode: service:chrome-0

volumes:
  imauth-data:
