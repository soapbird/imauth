x-chrome: &chrome
  image: imyounjs/chrome:latest
  shm_size: "2gb"
  restart: unless-stopped
  user: "0:0"
  environment:
    VNC_RESOLUTION: ${BROWSER_KASM_RESOLUTION:-1366x768}
    # KasmVNC needs a non-empty password to start its daemon. Auth is disabled
    # in the chrome image (-SecurityTypes None), so login is always immediate.
    VNC_PW: imauth
  healthcheck: &chrome-healthcheck
    test: ["CMD", "curl", "-f", "http://localhost:9223/json/version"]
    interval: 3s
    timeout: 5s
    retries: 10

x-chrome-proxy: &chrome-proxy
  image: imyounjs/chrome-proxy:latest
  restart: unless-stopped

name: service-imauth

services:
  chrome-0:
    container_name: imauth-chrome-0
    <<: *chrome
    volumes:
      - ${IMAUTH_DATA:-../imauth-data}/chrome-0:/home/kasm-user/.config/chromium:rw
    healthcheck: *chrome-healthcheck

  chrome-0-proxy:
    container_name: imauth-chrome-proxy-0
    <<: *chrome-proxy
    depends_on:
      chrome-0:
        condition: service_healthy
    environment:
      UPSTREAM_HOST: chrome-0
    ports:
      - "${IMAUTH_NOVNC_PORT_0:-6101}:8080"

  server:
    container_name: imauth-server
    image: imyounjs/imauth:latest
    restart: unless-stopped
    user: "0:0"
    environment:
      - IMAUTH_CDP_URLS=http://chrome-0:9223
      - IMAUTH_GRPC_ADDR=0.0.0.0:50051
      - IMAUTH_DATA_DIR=/data/.imauth/data
      - IMAUTH_ENCRYPTION_KEY=${IMAUTH_ENCRYPTION_KEY}
      - IMAUTH_API_KEY=${IMAUTH_API_KEY}
      - IMAUTH_BROWSER_VIEWER_URLS=http://${IMAUTH_HOSTNAME:-localhost}:${IMAUTH_NOVNC_PORT_0:-6101}/index.html
    volumes:
      - ${IMAUTH_DATA:-../imauth-data}/imauth:/data/.imauth
    depends_on:
      chrome-0:
        condition: service_healthy
    ports:
      - "${IMAUTH_HOSTPORT:-6100}:50051"
    command: ["serve"]

networks:
  default:
    name: net-imauth
    driver: bridge
