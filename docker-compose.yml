x-chrome: &chrome
  image: docker.lowapple.io/imauth-chrome:latest
  shm_size: "2gb"
  restart: unless-stopped
  environment:
    VNC_RESOLUTION: ${BROWSER_KASM_RESOLUTION:-1366x768}
    # KasmVNC needs a non-empty password to start its daemon. Auth is disabled
    # in the chrome image (-SecurityTypes None), so login is always immediate.
    VNC_PW: imauth
  healthcheck: &chrome-healthcheck
    test: ["CMD", "curl", "-f", "http://localhost:9223/json/version"]
    interval: 3s
    timeout: 5s
    retries: 10

x-chrome-proxy: &chrome-proxy
  image: docker.lowapple.io/imauth-chrome-proxy:latest
  restart: unless-stopped

name: service-imauth

services:
  chrome-0:
    container_name: imauth-chrome-0
    <<: *chrome
    volumes:
      - ${IMAUTH_DATA:-../imauth-data}/chrome-0:/home/kasm-user/.config/chromium:rw
    healthcheck: *chrome-healthcheck

  chrome-0-proxy:
    container_name: imauth-chrome-proxy-0
    <<: *chrome-proxy
    depends_on:
      chrome-0:
        condition: service_healthy
    environment:
      UPSTREAM_HOST: chrome-0
      IMAUTH_VIEWER_TOKEN: ${IMAUTH_VIEWER_TOKEN:?Set IMAUTH_VIEWER_TOKEN to a random value of at least 32 characters}
      IMAUTH_VIEWER_COOKIE_SECURE: ${IMAUTH_VIEWER_COOKIE_SECURE:-}
    ports:
      - "127.0.0.1:${IMAUTH_NOVNC_PORT_0:-6101}:8080"

  server:
    container_name: imauth-server
    image: docker.lowapple.io/imauth:latest
    restart: unless-stopped
    environment:
      - IMAUTH_CDP_URLS=http://chrome-0:9223
      - IMAUTH_GRPC_ADDR=0.0.0.0:50051
      - IMAUTH_DATA_DIR=/data/.imauth/data
      - IMAUTH_ENCRYPTION_KEY=${IMAUTH_ENCRYPTION_KEY:?Set IMAUTH_ENCRYPTION_KEY to a 32-byte base64 key}
      - IMAUTH_API_KEY=${IMAUTH_API_KEY:?Set IMAUTH_API_KEY to a non-empty random value}
      - IMAUTH_BROWSER_VIEWER_URLS=${IMAUTH_VIEWER_SCHEME:-http}://${IMAUTH_HOSTNAME:-localhost}:${IMAUTH_NOVNC_PORT_0:-6101}/index.html?token=${IMAUTH_VIEWER_TOKEN:?Set IMAUTH_VIEWER_TOKEN to a random value of at least 32 characters}
    volumes:
      - ${IMAUTH_DATA:-../imauth-data}/imauth:/data/.imauth
    depends_on:
      chrome-0:
        condition: service_healthy
    ports:
      - "127.0.0.1:${IMAUTH_HOSTPORT:-6100}:50051"
    command: ["serve"]

networks:
  default:
    name: net-imauth
    driver: bridge
