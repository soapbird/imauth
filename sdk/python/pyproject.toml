[project]
name = "imauth"
version = "0.4.1"
description = "Python SDK for imauth — social auth manager"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "pydantic>=2.0",
]

[project.scripts]
imauth = "imauth.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imauth"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
